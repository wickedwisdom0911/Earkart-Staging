name: earkart_omni
description: "A new Flutter project."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  #utils
  cupertino_icons: ^1.0.8
  flutter_dotenv: ^5.2.1
  equatable: ^2.0.7
  google_fonts: ^4.0.3
  intl: ^0.20.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_bloc: ^9.1.1
  permission_handler: ^12.0.0+1
  path_provider: ^2.1.5
  file_picker: ^10.1.9
  open_filex: ^4.7.0
  dio: ^5.8.0+1
  pretty_dio_logger: ^1.4.0
  get: ^4.7.2
  get_it: ^8.0.3
  font_awesome_flutter: ^10.8.0
  logger: ^2.5.0
  url_launcher: ^6.3.1
  easy_debounce: ^2.0.3
  package_info_plus: any
  device_info_plus: ^11.5.0
  dartz: ^0.10.1
  freezed_annotation: ^2.4.1
  agora_rtc_engine: ^6.5.2
  socket_io_client: ^3.1.2
  connectivity_plus: ^6.0.5
  internet_connection_checker: ^3.0.1
  wakelock_plus: ^1.2.8
  battery_plus: ^5.0.2

  #ui
  figma_squircle: ^0.6.3
  modal_bottom_sheet: ^3.0.0
  flutter_animate: ^4.5.2
  fluttertoast: ^8.2.1
  camera: ^0.11.1
  usb_serial_kotlin:
    path: packages/usb_serial_kotlin
  flutter_uvc_camera:
    path: packages/flutter_uvc_camera
  flutter_webrtc: ^1.0.0
  webrtc_interface: ^1.2.2+hotfix.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  build_runner: ^2.3.3
  hive_generator: ^2.0.1
  freezed: ^2.4.5
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/

flutter_launcher_icons:
  android: true
  adaptive_icon_background: "#242C69"
  adaptive_icon_foreground: "assets/images/app_icon.png"
  image_path: "assets/images/app_icon.png"

flutter_native_splash:
  color: "#242C69"
  image: "assets/images/splash_icon.png"
  android_12:
    image: "assets/images/splash_icon.png"
  android: true
  fullscreen: true
